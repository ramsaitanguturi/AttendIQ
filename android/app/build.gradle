plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.ramsa.attendiq.attend_iq"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.ramsa.attendiq.attend_iq"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias = System.getenv("KEY_ALIAS") ?: keystoreProperties['keyAlias']
            keyPassword = System.getenv("KEY_PASSWORD") ?: keystoreProperties['keyPassword']
            storeFile = System.getenv("STORE_FILE") ? file(System.getenv("STORE_FILE")) : (keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null)
            storePassword = System.getenv("STORE_PASSWORD") ?: keystoreProperties['storePassword']
        }
    }

    flavorDimensions "default"

    productFlavors {
        prod {
            dimension "default"
            applicationId "com.ramsa.attendiq.attend_iq"
            resValue "string", "app_name", "AttendIQ"
            resValue "string", "deep_link_scheme", "attendiq"
            manifestPlaceholders = [
                appName: "AttendIQ",
                deepLinkScheme: "attendiq"
            ]
        }
        beta {
            dimension "default"
            applicationId "com.ramsa.attendiq.attend_iq.beta"
            resValue "string", "app_name", "AttendIQ Beta"
            resValue "string", "deep_link_scheme", "attendiq-beta"
            manifestPlaceholders = [
                appName: "AttendIQ Beta",
                deepLinkScheme: "attendiq-beta"
            ]
        }
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Signing with release keys if configured via key.properties or env vars
            if (keystorePropertiesFile.exists() || System.getenv("STORE_FILE") != null) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }
        }
    }

    applicationVariants.all { variant ->
        if (variant.name == 'prodRelease') {
            variant.assembleProvider.get().doLast {
                copy {
                    from "${rootProject.buildDir}/app/outputs/flutter-apk/app-prod-release.apk"
                    into "${rootProject.buildDir}/app/outputs/flutter-apk/"
                    rename { 'app-release.apk' }
                }
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation 'androidx.work:work-runtime-ktx:2.8.1'
}

configurations.all {
    resolutionStrategy {
        force 'androidx.work:work-runtime:2.8.1'
        force 'androidx.work:work-runtime-ktx:2.8.1'
    }
}
